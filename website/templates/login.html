{% extends "base.html" %} {% block title %}Login{% endblock %} {% block content%}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">
        <i class="fas fa-comments"></i>
      </div>
      <h2>Welcome Back</h2>
      <p class="text-muted">Sign in to continue to CK Chat</p>
    </div>

    <form id="myLogin" method="POST" class="auth-form">
      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="email" name="email" placeholder=" " required>
        <label for="email"><i class="fas fa-envelope me-2"></i>Email Address</label>
      </div>

      <div class="form-floating mb-3">
        <input type="password" id="password" class="form-control" name="password" placeholder=" " required>
        <label for="password"><i class="fas fa-lock me-2"></i>Password</label>
      </div>

      <div class="form-check mb-4">
        <input type="checkbox" class="form-check-input" id="passShow" onclick="showPass()">
        <label class="form-check-label" for="passShow">Show password</label>
      </div>

      <button type="submit" id="loginSelf" class="btn btn-primary btn-lg w-100 mb-3">
        <i class="fas fa-sign-in-alt me-2"></i>Login
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a href="/signup" class="auth-link">Sign up</a></p>
    </div>
  </div>
</div>
{% endblock %}
